<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#primaryGradient)"/>
  
  <!-- Main Focus Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGradient)" stroke-width="8" opacity="0.3"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accentGradient)" stroke-width="6" opacity="0.5"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#accentGradient)" stroke-width="4" opacity="0.7"/>
  
  <!-- Center Focus Point -->
  <circle cx="256" cy="256" r="60" fill="url(#accentGradient)" opacity="0.9"/>
  
  <!-- Inner Focus Dot -->
  <circle cx="256" cy="256" r="20" fill="url(#highlightGradient)"/>
  
  <!-- Focus Lines -->
  <line x1="256" y1="76" x2="256" y2="116" stroke="url(#highlightGradient)" stroke-width="3" opacity="0.8"/>
  <line x1="256" y1="396" x2="256" y2="436" stroke="url(#highlightGradient)" stroke-width="3" opacity="0.8"/>
  <line x1="76" y1="256" x2="116" y2="256" stroke="url(#highlightGradient)" stroke-width="3" opacity="0.8"/>
  <line x1="396" y1="256" x2="436" y2="256" stroke="url(#highlightGradient)" stroke-width="3" opacity="0.8"/>
  
  <!-- Diagonal Focus Lines -->
  <line x1="128" y1="128" x2="158" y2="158" stroke="url(#highlightGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="384" y1="128" x2="354" y2="158" stroke="url(#highlightGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="128" y1="384" x2="158" y2="354" stroke="url(#highlightGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="384" y1="384" x2="354" y2="354" stroke="url(#highlightGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Elegant Border -->
  <rect x="20" y="20" width="472" height="472" rx="60" fill="none" stroke="url(#highlightGradient)" stroke-width="2" opacity="0.3"/>
</svg>